    <style>
        .buttonDebugText {
            display: none;
        }

        .friendlyRomanization {
            visibility: visible;
            color: gray;
            font-style: italic;
            margin-left: 0.4em;
            font-size: 0.7em;
        }

        button {
            display: inline-block;
            padding: 0.34em;
            margin: 0.2em;
            font-size: 2em;
            width: 100%;
            height: 100%;
            background: lightgray;
        }

        .complexAction {
            width: auto;
            margin-bottom: 1.8em;
        }

        textarea {
            font-size: 3em;
        }

        .eastCreeRow {
            background: blue;
        }

        .eastCree {
            border-color: blue;
        }
    </style>
