        let rotateRightLastCharacterInTextField = (event) => {
            let textOutput = document.getElementById("textOutput");
            let textOutputInitialValue = textOutput.value;
            if (textOutputInitialValue) {
                let valueLength = textOutputInitialValue.length;
                if (valueLength < 1) {
                    return; // There is no character to rotate. Nothing to do here.
                }
                let lastChar = textOutputInitialValue.substring(valueLength - 1, valueLength);
                if (isNonConsonantInitialSyllable(lastChar)) {
                    let rotatedChar = rotateRightNonConsonantInitialSyllable(lastChar);
                    if (rotatedChar) {
                        textOutput.value = textOutput.value.substring(0, valueLength - 1) + rotatedChar;
                    }
                } if (isWSyllable(lastChar)) {
                    let rotatedChar = rotateRightWSyllable(lastChar);
                    if (rotatedChar) {
                        textOutput.value = textOutput.value.substring(0, valueLength - 1) + rotatedChar;
                    }
                }
                else {
                    console.log("cannot rotate the last character");
                }
            }
        }
        
        function isNonConsonantInitialSyllable(currentChar) {
            return currentChar === CANADIAN_SYLLABICS_E
              || currentChar === CANADIAN_SYLLABICS_I
              || currentChar === CANADIAN_SYLLABICS_O
              || currentChar === CANADIAN_SYLLABICS_A
              || currentChar === CANADIAN_SYLLABICS_II
              || currentChar === CANADIAN_SYLLABICS_OO
              || currentChar === CANADIAN_SYLLABICS_AA;
        }

        function rotateRightNonConsonantInitialSyllable(currentChar) {
            if (currentChar === CANADIAN_SYLLABICS_E) {
                return CANADIAN_SYLLABICS_A;
            } else if (currentChar === CANADIAN_SYLLABICS_A) {
                return CANADIAN_SYLLABICS_I;
            } else if (currentChar === CANADIAN_SYLLABICS_I) {
                return CANADIAN_SYLLABICS_O;
            } else if (currentChar === CANADIAN_SYLLABICS_O) {
                return CANADIAN_SYLLABICS_E;
            } else if (currentChar === CANADIAN_SYLLABICS_AA) {
                return CANADIAN_SYLLABICS_II;
            } else if (currentChar === CANADIAN_SYLLABICS_II) {
                return CANADIAN_SYLLABICS_OO;
            } else if (currentChar === CANADIAN_SYLLABICS_OO) {
                return CANADIAN_SYLLABICS_AA;
            } else {
                console.log("not a recognized character for this function");
            }
        }

              || currentChar === CANADIAN_SYLLABICS_KAA
              || currentChar === CANADIAN_SYLLABICS_FINAL_GRAVE;
        }

        
        let rotateRightFunction = rotateRightLastCharacterInTextField;
        let rotateRightButton = document.getElementById("rotateRightButton");
        rotateRightButton.addEventListener("click", rotateRightFunction);
        
        let lengthenVowelFunction = lengthenVowelOfLastCharacterInTextField;
        let lengthenVowelButton = document.getElementById("lengthenVowelButton");
        lengthenVowelButton.addEventListener("click", lengthenVowelFunction);
        
        
        
        
    </script>
